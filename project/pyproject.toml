[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"


[project]
name = "pyimage"
version = "0.1.0"
description = "Image-processing algorithms developed for Introduction to Image Processing with Python"
authors = [
    { name = "Robert Elliott" }
]
requires-python = ">=3.13,<3.14"

dependencies = [
    "numpy",
    "matplotlib",
    "pillow",
]


[tool.setuptools.packages.find]
where = ["src"]